name: CI Pipeline

# runs ci whenever push and pull request happens on main
on:
  push:
    branches: [main]
  pull_request: # probably will not be used but just in case we need pull request in the future
    branches: [main]

# the jobs need to be done
jobs:
  test: # test the code
    name: Run Unit Tests
    runs-on: ubuntu-latest # make it run on a virtual machine with lastest version of ubuntu
    steps: # steps for the job
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn -B test